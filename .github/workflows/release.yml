name: Build and publish Nextcloud release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  APP_ID: nextcloud_migrate
  NEXTCLOUD_VERSION: stable31

jobs:
  build_and_publish:
    name: Build, sign, package, and publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f

      - name: Set up PHP
        uses: shivammathur/setup-php@afefcaf556d98dc7896cca380e181decb609ca44
        with:
          php-version: "8.3"
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@64ed1bf0c8bb7e5f43ba4fd304667d43d5e1f349
        with:
          node-version: "22"
          cache: npm

      - name: Set up Nextcloud server
        uses: SMillerDev/nextcloud-actions/setup-nextcloud@a1964c2cf903781e17b965a0938a70c694379c42
        with:
          cron: false
          version: ${{ env.NEXTCLOUD_VERSION }}
          database-type: sqlite

      - name: Validate release version metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_TAG#v}"
          app_version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -n1)"
          package_version="$(node -p "require('./package.json').version")"
          app_id="$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' appinfo/info.xml | head -n1)"

          test -n "$release_version"
          test -n "$app_version"
          test -n "$package_version"
          test -n "$app_id"

          if [ "$app_id" != "$APP_ID" ]; then
            echo "APP_ID ($APP_ID) does not match appinfo/info.xml id ($app_id)." >&2
            exit 1
          fi

          if [ "$release_version" != "$app_version" ]; then
            echo "Release tag version ($release_version) does not match appinfo/info.xml version ($app_version)." >&2
            exit 1
          fi

          if [ "$release_version" != "$package_version" ]; then
            echo "Release tag version ($release_version) does not match package.json version ($package_version)." >&2
            exit 1
          fi

      - name: Install development dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Validate PHP
        run: |
          composer lint
          composer test

      - name: Build frontend bundle
        run: npm run build

      - name: Prepare signing certificate files
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -euo pipefail

          cert_dir="$HOME/.nextcloud/certificates"
          mkdir -p "$cert_dir"
          printf '%s' "$APP_PRIVATE_KEY" > "$cert_dir/${APP_ID}.key"
          printf '%s' "$APP_PUBLIC_CRT" > "$cert_dir/${APP_ID}.crt"
          chmod 600 "$cert_dir/${APP_ID}.key" "$cert_dir/${APP_ID}.crt"

      - name: Assemble signed release archive
        run: |
          set -euo pipefail

          build_root="$RUNNER_TEMP/appstore"
          release_dir="$build_root/$APP_ID"
          archive_path="$RUNNER_TEMP/${APP_ID}.tar.gz"

          rm -rf "$build_root" "$archive_path"
          mkdir -p "$release_dir"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='vendor/' \
            "$GITHUB_WORKSPACE/" "$release_dir/"

          composer install \
            --working-dir="$release_dir" \
            --no-dev \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader

          rm -f \
            "$release_dir/composer.json" \
            "$release_dir/composer.lock" \
            "$release_dir/package.json" \
            "$release_dir/package-lock.json" \
            "$release_dir/phpunit.xml.dist" \
            "$release_dir/webpack.config.js"
          rm -rf "$release_dir/src"
          rm -f "$release_dir/appinfo/signature.json"

          php "$GITHUB_WORKSPACE/../server/occ" integrity:sign-app \
            --privateKey="$HOME/.nextcloud/certificates/${APP_ID}.key" \
            --certificate="$HOME/.nextcloud/certificates/${APP_ID}.crt" \
            --path="$release_dir"

          tar -czf "$archive_path" -C "$build_root" "$APP_ID"

      - name: Upload app tarball to GitHub release
        id: upload_release_asset
        uses: svenstaro/upload-release-action@483c1e56f95e88835747b1c7c60581215016cbf2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ runner.temp }}/${{ env.APP_ID }}.tar.gz
          asset_name: ${{ env.APP_ID }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: Publish to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@669734a3b4fb1ff7a636ae6d5bf2c18fab10a4e0
        with:
          app_name: ${{ env.APP_ID }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.upload_release_asset.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ github.event.release.prerelease }}

      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/.nextcloud/certificates/${APP_ID}.key" "$HOME/.nextcloud/certificates/${APP_ID}.crt"
