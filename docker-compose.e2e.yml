# Docker Compose configuration for end-to-end tests.
# Source Nextcloud has the app installed; target is a clean instance.
# Both are exposed on localhost so Playwright (running on the host) can reach them.
#
# NOTE: We intentionally do NOT set NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD
# here.  Those env vars cause the image's entrypoint to run `occ maintenance:install`
# inside the request handler (lazy install), which keeps /status.php returning 503
# until the install finishes.  Instead, the CI workflow runs `occ maintenance:install`
# explicitly via `docker exec` after the container is up, which is synchronous and
# faster on constrained CI runners.

services:
  nc-source:
    image: nextcloud:28-apache
    container_name: nc-source
    ports:
      - "8081:80"
    volumes:
      # Mount the app into custom_apps so occ can enable it.
      - ./:/var/www/html/custom_apps/nextcloud_migrate:ro
      - nc_source_data:/var/www/html/data
    networks:
      - e2e

  nc-target:
    image: nextcloud:28-apache
    container_name: nc-target
    ports:
      - "8082:80"
    volumes:
      - nc_target_data:/var/www/html/data
    networks:
      - e2e

volumes:
  nc_source_data:
  nc_target_data:

networks:
  e2e:
