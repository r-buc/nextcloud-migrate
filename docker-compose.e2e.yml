# Docker Compose configuration for end-to-end tests.
# Source Nextcloud has the app installed; target is a clean instance.
# Both are exposed on localhost so Playwright (running on the host) can reach them.

services:
  nc-source:
    image: nextcloud:28-apache
    container_name: nc-source
    ports:
      - "8081:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: adminpass
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      # Mount the app into custom_apps so occ can enable it.
      - ./:/var/www/html/custom_apps/nextcloud_migrate:ro
      - nc_source_data:/var/www/html/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - e2e

  nc-target:
    image: nextcloud:28-apache
    container_name: nc-target
    ports:
      - "8082:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: adminpass
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nc_target_data:/var/www/html/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - e2e

volumes:
  nc_source_data:
  nc_target_data:

networks:
  e2e:
